name: python-package

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: python-package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    uses: scitex-ai/.github/.github/workflows/sdk-python-package.yml@main
