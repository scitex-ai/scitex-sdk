name: release

# SDK-owned App/UI source, frontend, and artifact gates precede publication.
# [all] must resolve normally against published dependencies; unpublished
# scitex-dev.project support deliberately holds this release.
#
# TRUSTED PUBLISHING matches on (repository, workflow FILENAME, environment).
# This file must keep its name (pypi-p...-tag.yml) and the publish job must keep
# `environment: pypi`, or the PyPI trust config for scitex-sdk will not match.
# The operator registers the PyPI project + trusted publisher for
# (scitex-ai/scitex-sdk, pypi-p...-tag.yml, pypi) BEFORE the first tag is pushed.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.1.0) — must already exist on the repo'
        required: true
        type: string

jobs:
  frontend:
    uses: ./.github/workflows/frontend.yml
    with:
      ref: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

  test:
    runs-on: [self-hosted, Linux, X64, scitex-ci]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - name: Isolate release state and caches
        run: |
          set -euo pipefail
          release_state="$RUNNER_TEMP/scitex-sdk-release-${GITHUB_JOB}-${{ matrix.python-version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$release_state/scitex" "$release_state/pycache" \
            "$release_state/pip-cache" "$release_state/tmp"
          printf '%s\n' "SCITEX_DIR=$release_state/scitex" \
            "PYTHONPYCACHEPREFIX=$release_state/pycache" \
            "PIP_CACHE_DIR=$release_state/pip-cache" \
            "TMPDIR=$release_state/tmp" >> "$GITHUB_ENV"
      - name: Use a job-owned Python tool cache
        run: |
          tool_cache="$RUNNER_TEMP/scitex-sdk-release-python-tools-${{ matrix.python-version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$tool_cache"
          printf '%s\n' "RUNNER_TOOL_CACHE=$tool_cache" \
            "AGENT_TOOLSDIRECTORY=$tool_cache" >> "$GITHUB_ENV"
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create an isolated test environment
        run: |
          python -m venv "$RUNNER_TEMP/scitex-sdk-release-tests-${{ matrix.python-version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$RUNNER_TEMP/scitex-sdk-release-tests-${{ matrix.python-version }}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Contributor groups preserve runtime-only [all]. The project API
          # has a separate real all-extra resolution gate below.
          python -m pip install -e ".[gui,chat,mcp,cli]" --group dev
      - name: Run tests
        run: python -m pytest tests/
      - name: Run strict project-access controls with synthetic in-memory data
        env:
          SCITEX_ACCESS_STRICT: "1"
        run: >-
          python -m pytest tests/scitex_sdk/app/test_access_django.py
          tests/scitex_sdk/app/api_access/test___init__.py

  build:
    needs: [test, frontend]
    runs-on: [self-hosted, Linux, X64, scitex-ci]
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - name: Isolate release state and caches
        run: |
          set -euo pipefail
          release_state="$RUNNER_TEMP/scitex-sdk-release-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$release_state/scitex" "$release_state/pycache" \
            "$release_state/pip-cache" "$release_state/tmp"
          printf '%s\n' "SCITEX_DIR=$release_state/scitex" \
            "PYTHONPYCACHEPREFIX=$release_state/pycache" \
            "PIP_CACHE_DIR=$release_state/pip-cache" \
            "TMPDIR=$release_state/tmp" >> "$GITHUB_ENV"
      - name: Use a job-owned Python tool cache
        run: |
          tool_cache="$RUNNER_TEMP/scitex-sdk-release-build-python-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$tool_cache"
          printf '%s\n' "RUNNER_TOOL_CACHE=$tool_cache" \
            "AGENT_TOOLSDIRECTORY=$tool_cache" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
          # fail-loud: an empty dist/ must stop the pipeline here.
          ls -1 dist/*.whl dist/*.tar.gz >/dev/null
      - name: Verify source, sdist, wheel, and frontend package identity
        run: >-
          python scripts/verify-artifacts.py --source .
          --wheel dist/scitex_sdk-*.whl --sdist dist/scitex_sdk-*.tar.gz
          --tag "${{ steps.ver.outputs.version }}"
      - name: Resolve the actual all-extra wheel with published dependencies
        run: |
          set -euo pipefail
          # This is a release gate, not a metadata override or --no-deps install.
          wheel=$(realpath dist/scitex_sdk-*.whl)
          python -m venv "$RUNNER_TEMP/scitex-sdk-all-resolution"
          py="$RUNNER_TEMP/scitex-sdk-all-resolution/bin/python"
          "$py" -m pip install --upgrade pip
          "$py" -m pip install "$wheel[all]"
          "$py" -m pip check
          # SDK direct ownership remains mandatory. Transitive legacy owners
          # are observable during sequential bootstrap, never retirement proof.
          "$py" scripts/ownership_gate.py --mode bootstrap-observation \
            --graph sdk-all --output "$RUNNER_TEMP/sdk-bootstrap-ownership.json"
          printf '%s\n' '### Dependency retirement remains incomplete' \
            'Normal SDK [all] resolution and pip check passed; inspect the ownership report.' \
            'Repository archival is administrative state, not dependency/migration evidence.' \
            'The separate retirement workflow must pass every registered consumer graph.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-bootstrap-ownership
          path: ${{ runner.temp }}/sdk-bootstrap-ownership.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Trusted publishing uses a Docker action; the CPU pool includes nodes
    # without Docker. Keep this job on the existing dedicated Docker runner.
    runs-on: [self-hosted, Linux, X64, scitex-docker]
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: [self-hosted, Linux, X64, scitex-ci]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*
