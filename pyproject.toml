[project]
name = "scitex-sdk"
version = "0.1.0"
description = "SciTeX SDK — one project for the app contract (scitex_sdk.app) + UI shell (scitex_sdk.ui). Step 1: thin facade re-exporting scitex-app + scitex-ui; implementation consolidates gradually."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scitex-app>=0.24.0",
    "scitex-ui>=0.20.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
