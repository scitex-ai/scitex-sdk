[project]
name = "scitex-sdk"
version = "0.2.0"
description = "SciTeX SDK — one project for the app contract (scitex_sdk.app) + UI shell (scitex_sdk.ui). Step 1: thin facade re-exporting scitex-app + scitex-ui; implementation consolidates gradually."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "scitex-app>=0.24.0",
    "scitex-ui>=0.20.3",
]

[project.scripts]
scitex-sdk = "scitex_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
