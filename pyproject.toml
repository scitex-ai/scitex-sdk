[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "scitex-sdk"
version = "0.3.1"
description = "SciTeX app contracts, UI components, and host capabilities in one SDK."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "app-sdk", "ui", "django", "typescript"]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "scitex-config>=0.3.6",
    "scitex-logging>=0.1.0",
]

# Physical app/UI implementations always ship; extras install their optional
# runtime dependencies. No extra depends on the retired app/UI distributions.
[project.optional-dependencies]
gui = ["django>=4.2"]
chat = ["anthropic>=0.25.0", "litellm>=1.0.0", "requests>=2.28.0"]
mcp = ["fastmcp>=2.0.0"]
cli = ["scitex-dev>=0.11.7"]
# This API is absent from published Dev 0.61.0. Keep the genuine release gate.
project = ["scitex-dev>=0.62.0"]
all = ["scitex-sdk[gui,chat,mcp,cli,project]"]

# Contributor tooling is not a public runtime capability. pip >=25.1 supports
# `pip install -e . --group dev`; docs use `--group docs`.
[dependency-groups]
dev = [
    "anthropic>=0.25.0",
    "babel>=2.12",
    "build>=1.0",
    "django>=4.2",
    "fastmcp>=2.0.0",
    "hatchling>=1.20",
    "litellm>=1.0.0",
    "openapi-spec-validator>=0.8",
    "packaging>=23.0",
    "pytest-cov>=4.0.0",
    "pytest>=7.0.0",
    "requests>=2.28.0",
    # The real access core used by strict contributor conformance ships here.
    "scitex-dev>=0.61.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.scripts]
scitex-sdk = "scitex_sdk.cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-sdk = "scitex_sdk"
# Component names identify SDK-owned documentation, not distributions.
scitex-app = "scitex_sdk.app"
scitex-ui = "scitex_sdk.ui"

[project.entry-points."scitex_dev.skills"]
scitex-sdk = "scitex_sdk"
scitex-app = "scitex_sdk.app"
scitex-ui = "scitex_sdk.ui"

[project.entry-points."scitex_dev.linter.plugins"]
ui = "scitex_sdk.ui._linter_plugin:get_plugin"

[project.urls]
Homepage = "https://github.com/scitex-ai/scitex-sdk"
Repository = "https://github.com/scitex-ai/scitex-sdk"

# Shared artifacts override broad ignore rules in BOTH sdist and wheel.
# Building a wheel from the sdist must retain raw TS, generated bundles,
# artwork, vendor assets, catalogs, templates, documentation, and skills.
[tool.hatch.build]
exclude = ["node_modules/**", "**/__pycache__/**", "**/*.pyc"]
artifacts = [
    "src/scitex_sdk/package.json",
    "src/scitex_sdk/app/static/**",
    "src/scitex_sdk/ui/static/**",
    "src/scitex_sdk/**/templates/**/*.html",
    "src/scitex_sdk/**/locale/**/*.mo",
    "src/scitex_sdk/**/_skills/**",
    "src/scitex_sdk/**/_docs/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_sdk"]

[tool.hatch.build.targets.sdist]
# npm links node_modules/@scitex/sdk back to the source package. An unrestricted
# traversal can visit that inode first and omit src from the sdist entirely.
# Select real project inputs directly, including the release/frontend gates.
only-include = [
    "src/scitex_sdk", "scripts", "tests", "docs", "examples", ".github",
    "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml", ".gitignore",
    "package.json", "package-lock.json", "tsconfig.json", "eslint.config.mjs",
    "vitest.config.ts", ".readthedocs.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: subprocess package/build gates",
    "smoke: fast CLI happy-path controls",
    "e2e: end-to-end workflows against real subsystems",
]

[tool.coverage.run]
parallel = true
source = ["scitex_sdk"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.ruff.lint.isort]
known-first-party = ["scitex_sdk"]

[tool.scitex_dev]
# Existing App LLM_MODEL alias remains until its documented removal.
env_allowlist = ["LLM_MODEL"]

[tool.scitex_dev.audit]
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
